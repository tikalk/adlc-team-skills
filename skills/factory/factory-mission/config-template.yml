# factory-mission — workflow configuration
#
# Copy to .adlc/workflow/workflow-config.yml in your project and edit.
# Every field is optional; defaults are shown below.

workflow:
  # Execution mode (sync default). The --async / --sync invocation flag
  # overrides this per mission.
  execution: sync            # sync | async

  # Supervision (sync only — async always forces autonomous).
  supervision: gated         # gated | hybrid | autonomous

  # Convergence loop budgets.
  max_iterations: 5          # do-while cap on implement↺converge
  max_spec_corrections: 2    # outer spec-correction cap (triggered by SPEC_CORRECTION_NEEDED signal)
  circuit_breaker: 3         # max consecutive non-converging iterations

  # Quality threshold (optional). If set (0-100), converge must report a
  # quality score >= threshold to exit with DONE. Below threshold is treated
  # as CONTINUE.
  quality_threshold: null

  # TDD test/code split (autonomous/supervised runs). true (default): the
  # implement step splits into a Test Agent (RED gate — suite must fail at
  # least one test before any code exists) and an Implement Agent (GREEN
  # gate — suite must pass before converge). false: skip the split — only
  # for runs with no test surface (docs/config-only work).
  tdd: true

  # Per-step model routing (optional). If omitted, every step uses the
  # harness default model. Steps carry a `tier:` annotation (strong | fast);
  # the executor resolves tier -> concrete model using this map at dispatch.
  # models:
  #   strong: "claude-opus-4-6"   # brainstorm, specify, plan, implement
  #   fast: "claude-haiku-4-5"    # clarify, tasks, analyze, converge, trace

  # ── Worktree isolation ─────────────────────────────────────
  # Directory for factory worktrees. Each run gets its own worktree
  # derived from orchestrator + target slug.
  worktree_root: .adlc/worktrees

  # ── Lease liveness ─────────────────────────────────────────
  # How long (seconds) a heartbeat remains valid before a run is
  # considered stale. Default 900s = 15 min.
  lease_ttl: 900

  # ── Stall detection ────────────────────────────────────────
  # How long (seconds) without observable progress before a step
  # is checked for stall. Default 1200s = 20 min.
  stall_window: 1200

  # ── Lanes (optional) ───────────────────────────────────────
  # When absent, interactive stages run inline, unattended stages
  # run as agent (fresh session of same CLI).
  # When present, maps steps to lanes for cross-runtime dispatch.
  # lanes:
  #   runtimes:
  #     opencode:
  #       match: ["opencode"]
  #       stages:
  #         specify: { lane: inline }
  #         clarify: { lane: inline }
  #         implement: { lane: agent, model: null }
  #         converge: { lane: agent, model: null }
  #         analyze: { lane: agent, model: null }
  #     claude-code:
  #       match: ["claude"]
  #       stages:
  #         converge: { lane: "cli:claude-code" }
  #   cli:
  #     claude-code:
  #       command: ["claude", "--print", "{cwd}"]
  #       runtime_label: "Claude Code"
  #       skills_root: ".agents/skills"

  # ── fd leak prevention ─────────────────────────────────
  # Heartbeat process redirection — for CI/CD shells to not hang
  # heartbeat_redirect: /dev/null

  # ── Scratchpad tools ───────────────────────────────────
  # Directory for scratchpads. Persist across steps within a run.
  scratchpad_root: .adlc/workflow/scratchpads

  # ── Workflow memory ────────────────────────────────────
  # JSONL file for workflow memory. Persist knowledge across runs.
  memory_path: .adlc/workflow/memory.jsonl

  # ── Hierarchical context parameters ─────────────────────
  # Define values once, reference as {{params.<key>}}
  # Overrides: agent < workflow < repository < project < default
  # params:
  #   review_branch: main
  #   branch_suffix: "-feature"

  # ── Distributed locking across machines ────────────────
  # Enables remote lease markers and Git ref locking for multi-machine/CI safety.
  distributed_lock: true
  remote_lease_ttl: 900          # seconds (15 min)
  remote_heartbeat_interval: 300 # seconds (5 min)

