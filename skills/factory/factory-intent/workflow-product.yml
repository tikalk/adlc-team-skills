# factory-intent product-lane entry (thin single-lane workflow; dual-executor:
# LLM executor drives these steps via `workflow state` helpers with the gate
# inline; headless `adlc-cli workflow run` executes this file directly).
#
# Prompt-driven lane activation: when the brief needs product work only, run
# this entry instead of `workflow.yml` (both lanes). Mirrors the removed
# factory-product twin's step shape (specify → clarify → gate-decisions →
# build-and-verify); the gate keeps the scope-pinned contract (PDR drafts
# dir only, records/since/link).
#
# Route input (`route`) is resolved by the adaptive (LLM) executor at
# dispatch (init vs specify vs analyze-first). The steps below encode the
# greenfield default for headless runs.
#
# Correction loop: `analyze` ends with a terminal
# `VERDICT: OK | HIGH | CRITICAL` line; HIGH/CRITICAL re-runs the bounded
# build-and-verify cycle (max_iterations = 1 + mission max_corrections,
# default 2). The adaptive executor may route a correction back through
# clarify before re-implementing; the headless loop is a bounded
# re-implementation.
schema_version: "1.0"
workflow:
  id: factory-intent-product
  name: Intent Product Lane
  version: "1.0.0"
inputs:
  route:
    type: string
    enum: ["", greenfield, brownfield, refresh]
    default: greenfield
  verdict:
    type: string
    enum: ["", approve, reject]
  mr_url:
    type: string
    default: ""
steps:
  - id: specify
    type: command
    command: product-specify
  - id: clarify
    type: command
    command: product-clarify
  - id: gate-decisions
    type: gate
    message: "PDR decisions drafted and clarified. Approve before PRD.md generation?"
    options: [approve, reject]
    on_reject: retry
    verdict_input: verdict
    context:
      records: [".adlc/drafts/pdr/*.md"]
      since: "last_approved"
      link: "{{ inputs.mr_url }}"
  - id: build-and-verify
    type: do-while
    condition: "{{ steps.analyze.output.stdout | contains('VERDICT: CRITICAL') or steps.analyze.output.stdout | contains('VERDICT: HIGH') }}"
    max_iterations: 3
    steps:
      - id: implement
        type: command
        command: product-implement
      - id: analyze
        type: command
        command: product-analyze
