name: Test & Evaluate Skills

# Default token to read-only. A malicious dependency's install script
# (see incident 2026-08-04, commit 74f317d) can only do as much damage
# as the token it's handed; neither job here needs to write to the repo.
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-scripts:
    name: Run Pytest (Scripts & E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        # Pinned exact versions (no floating latest). The PyPI "promptfoo"
        # package (the official Python wrapper, not the npm CLI installed
        # below) is dropped here: nothing in tests/ or evals/ imports it -
        # it was only present as an indirect way to pull in `pyyaml`, which
        # test_playbook_integrity.py needs directly. Depend on pyyaml
        # explicitly instead of relying on that as a side effect.
        run: |
          pip install pytest==9.1.1 deepeval==4.1.5 pyyaml==6.0.3
      - name: Run Pytest
        run: |
          pytest tests/ evals/promptfoo/tests/ -v

  evaluate-skills:
    name: Run PromptFoo (Skill Evals)
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level `if` conditions, so we
      # expose them via job-level env and gate on that instead.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Optional routing for OpenAI-compatible providers (e.g. OpenCode Zen).
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      EVAL_MODEL: ${{ secrets.EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v6
      # Pinned exact version + --ignore-scripts: blocks pre/postinstall
      # scripts from any of promptfoo's transitive dependencies from
      # executing during install (the vector used in the 2026-08-04 incident).
      - name: Install PromptFoo
        run: npm install -g --ignore-scripts promptfoo@0.121.20
      - name: Run Tier 1 Evals
        # GitHub Models was retired 2026-07-30, so the eval provider now uses
        # the OpenAI API. Skip the eval when the secret isn't configured
        # (e.g. forks/PRs) so the rest of CI still passes.
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          promptfoo eval --config evals/promptfoo/config.js --no-cache

  ledger-integrity:
    name: Recurrence Ledger Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Branch must be up to date with main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "branch is behind origin/main: rebase, union ledger rows, deduplicate, re-validate"; exit 1; }
      - name: Ledger header, duplicates, provenance conflicts
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("skills/factory/factory-learn/references/recurrence-ledger.tsv")
          lines = p.read_text().splitlines()
          assert lines[0] == "PR\tpass\tcheck-item\tverdict-head\trun\titer\tauthor\tassoc\tverified-how\tverified-at\tstanding\ttier\tnote", "ledger header"
          rows = [l for l in lines[1:] if l.strip()]
          assert len(rows) == len(set(rows)), "duplicate full rows"
          seen = {}
          for r in rows:
              c = r.split("\t")
              k = (c[0], c[1], c[2], c[5])
              rest = tuple(c[3:5] + c[6:])
              if k in seen and seen[k] != rest:
                  raise SystemExit(f"provenance conflict for {k}")
              seen[k] = rest
          print(f"ledger OK: {len(rows)} rows")
          EOF
      - name: Ledger-writer label required for writer changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR that modifies writer paths must carry the ledger-writer label.
          # Read-only PRs (no writer-path changes) never require the label.
          # push events have no PR number and are exempt (exit 0 before any check).
          me="${{ github.event.pull_request.number }}"
          if [ -z "$me" ]; then
            echo "no PR number (push event): ledger-writer label gate skipped"
            exit 0
          fi
          writers=$(git diff --name-only origin/main...HEAD -- skills/factory/factory-learn/references/recurrence-ledger.tsv skills/factory/factory-learn/scripts/verify-recurrence.sh)
          if [ -z "$writers" ]; then
            echo "no writer-path changes: ledger-writer label not required"
            exit 0
          fi
          mine=$(gh api "repos/${{ github.repository }}/pulls/$me" --jq '[.labels[].name] | map(select(. == "ledger-writer")) | length')
          [ "$mine" -ge 1 ] || { echo "this PR modifies writer paths but lacks the ledger-writer label"; exit 1; }
          echo "ledger-writer label present for writer PR $me"
      - name: Single active ledger-writer PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Writer intent marker: a PR opts in by carrying the ledger-writer
          # label. File-match alone is not writer intent (any PR can touch the
          # ledger path in passing); the label distinguishes the writer.
          # The current PR is excluded: one active writer passes, two fail.
          me="${{ github.event.pull_request.number }}"
          others=$(gh api "search/issues?q=repo:${{ github.repository }}+type:pr+state:open+label:ledger-writer" --jq "[.items[] | select(.number != ($me | tonumber)) | .number] | length")
          [ "$others" -le 0 ] || { echo "another open ledger-writer PR exists"; exit 1; }
          echo "ledger-writer check OK (current PR: $me, other writers: $others)"
